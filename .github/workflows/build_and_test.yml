name: LivSeek Native CI

on:
  pull_request:
  push:
    branches:
      - main
      - test/*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  macos_arm64:
    name: macOS ARM64 build and ABI
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Build Apple-silicon wheel
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '3'
          MACOSX_DEPLOYMENT_TARGET: '15.0'
        run: |
          python -m pip install --upgrade pip build
          python -m pip wheel . --no-deps --no-cache-dir --wheel-dir dist

      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/mlx-*.whl

      - name: Validate LivSeek native ABI
        run: |
          python - <<'PY'
          import mlx.core as mx

          required = (
              "_open_expert_safetensors_direct",
              "_expert_ssd_direct_load_into_many",
              "_open_scalex_mode_a_direct",
              "_open_scalex_prefix_store",
              "_scalex_mode_a_prefix_stats",
              "_scalex_mode_a_load_into_many",
              "_scalex_mode_a_load_experts_into_many",
          )
          missing = [name for name in required if not hasattr(mx, name)]
          if missing:
              raise SystemExit(f"missing LivSeek native symbols: {missing}")

          values = mx.array([1.0, 2.0, 3.0])
          mx.eval(values)
          print("LivSeek native ABI: valid")
          PY
